<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivu Video Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#101216;color:#f5f6f7;font:15px system-ui,sans-serif}
main{max-width:900px;margin:auto}
h1{color:#b8f34a;margin-bottom:4px}
p,label{color:#c0c6cf}
.card{margin-top:16px;padding:18px;background:#1a1e25;border:1px solid #303640;border-radius:14px}
.preview{position:relative;background:#050607;border-radius:10px;overflow:hidden}
video{display:block;width:100%;max-height:62vh;margin:auto}
#overlay{position:absolute;left:5%;right:5%;bottom:14%;color:white;text-align:center;font-size:clamp(22px,5vw,48px);font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 2px 9px #000;pointer-events:none}
input{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #3a414c;border-radius:8px;background:#111419;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{margin-top:14px;padding:12px 17px;border:0;border-radius:9px;background:#b8f34a;color:#14180d;font-weight:750;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status{min-height:24px}
@media(max-width:600px){body{padding:14px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Vivu Video Editor</h1>
  <p>Bản thử nghiệm: chọn video, cắt đoạn, thêm chữ và xuất WebM.</p>

  <section class="card">
    <label for="file">Chọn video</label>
    <input id="file" type="file" accept="video/*">
  </section>

  <section class="card">
    <div class="preview">
      <video id="video" controls playsinline></video>
      <div id="overlay"></div>
    </div>

    <p id="duration">Chưa chọn video</p>

    <div class="row">
      <label for="start">Bắt đầu (giây)
        <input id="start" type="number" min="0" step="0.1" value="0">
      </label>
      <label for="end">Kết thúc (giây)
        <input id="end" type="number" min="0" step="0.1" value="0">
      </label>
    </div>

    <label for="caption">Chữ trên video</label>
    <input id="caption" type="text" placeholder="Ví dụ: Một ngày thật đẹp">

    <button id="export" disabled>Xuất video WebM</button>
    <p id="status"></p>
  </section>
</main>

<script>
const fileInput = document.querySelector("#file");
const video = document.querySelector("#video");
const startInput = document.querySelector("#start");
const endInput = document.querySelector("#end");
const captionInput = document.querySelector("#caption");
const overlay = document.querySelector("#overlay");
const exportButton = document.querySelector("#export");
const statusText = document.querySelector("#status");
const durationText = document.querySelector("#duration");

let videoUrl = null;

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = URL.createObjectURL(file);
  video.src = videoUrl;
  video.load();
  statusText.textContent = "";
});

video.addEventListener("loadedmetadata", () => {
  const duration = video.duration;
  startInput.max = duration;
  endInput.max = duration;
  startInput.value = "0";
  endInput.value = duration.toFixed(1);
  durationText.textContent = `Thời lượng: ${duration.toFixed(1)} giây`;
  exportButton.disabled = false;
});

captionInput.addEventListener("input", () => {
  overlay.textContent = captionInput.value;
});

function seekTo(seconds) {
  return new Promise(resolve => {
    if (Math.abs(video.currentTime - seconds) < 0.05) {
      resolve();
      return;
    }

    let finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      resolve();
    };

    video.addEventListener("seeked", done, { once: true });
    video.currentTime = seconds;
    setTimeout(done, 1500);
  });
}

exportButton.addEventListener("click", async () => {
  if (!video.src || !Number.isFinite(video.duration)) return;

  const start = Math.max(0, Number(startInput.value) || 0);
  const end = Math.min(video.duration, Number(endInput.value) || video.duration);

  if (end <= start) {
    statusText.textContent = "Thời điểm kết thúc phải sau thời điểm bắt đầu.";
    return;
  }

  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    statusText.textContent = "Hãy thử mở trang bằng Chrome hoặc Edge.";
    return;
  }

  exportButton.disabled = true;
  statusText.textContent = "Đang chuẩn bị xuất…";

  const canvas = document.createElement("canvas");
  const scale = Math.min(
    1,
    1920 / Math.max(video.videoWidth, video.videoHeight)
  );

  canvas.width = Math.max(2, Math.round(video.videoWidth * scale));
  canvas.height = Math.max(2, Math.round(video.videoHeight * scale));
  const ctx = canvas.getContext("2d");

  function drawFrame() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const fit = Math.min(
      canvas.width / video.videoWidth,
      canvas.height / video.videoHeight
    );
    const w = video.videoWidth * fit;
    const h = video.videoHeight * fit;

    ctx.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);

    const text = captionInput.value.trim();
    if (!text) return;

    const fontSize = Math.max(24, Math.round(canvas.width * 0.055));
    ctx.font = `800 ${fontSize}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, fontSize * 0.13);
    ctx.strokeStyle = "rgba(0,0,0,.85)";
    ctx.fillStyle = "white";

    const lines = text.split("\n").slice(0, 3);
    const lineHeight = fontSize * 1.2;
    const firstY = canvas.height * 0.78 - ((lines.length - 1) * lineHeight) / 2;

    lines.forEach((line, i) => {
      const y = firstY + i * lineHeight;
      ctx.strokeText(line, canvas.width / 2, y);
      ctx.fillText(line, canvas.width / 2, y);
    });
  }

  let stream;

  try {
    video.pause();
    await seekTo(start);
    drawFrame();

    const canvasStream = canvas.captureStream(30);
    const tracks = [...canvasStream.getVideoTracks()];
    const audioStream = video.captureStream?.() || video.mozCaptureStream?.();

    if (audioStream) tracks.push(...audioStream.getAudioTracks());
    stream = new MediaStream(tracks);

    const mimeType =
      MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? "video/webm;codecs=vp9,opus"
        : "video/webm";

    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = event => {
      if (event.data && event.data.size) chunks.push(event.data);
    };

    recorder.onerror = () => {
      statusText.textContent = "Có lỗi khi xuất video.";
      exportButton.disabled = false;
      stream.getTracks().forEach(track => track.stop());
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "vivu-video.webm";
      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 5000);
      stream.getTracks().forEach(track => track.stop());
      exportButton.disabled = false;
      statusText.textContent = "Xong — video đã tải về máy.";
    };

    let animationId;

    function render() {
      drawFrame();

      if (video.currentTime >= end || video.ended) {
        video.pause();
        cancelAnimationFrame(animationId);
        recorder.stop();
        return;
      }

      animationId = requestAnimationFrame(render);
    }

    recorder.start();
    statusText.textContent = "Đang xuất video…";
    await video.play();
    render();
  } catch (error) {
    console.error(error);
    if (stream) stream.getTracks().forEach(track => track.stop());
    exportButton.disabled = false;
    statusText.textContent =
      "Không xuất được. Hãy thử Chrome/Edge và một video khác.";
  }
});
</script>
</body>
</html>
